services:
  knowledgepilot:
    build: .
    ports:
      - "127.0.0.1:${KP_PORT:-8000}:8000"
    volumes:
      - knowledgepilot_data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/health', timeout=3).close()"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
volumes:
  knowledgepilot_data:
